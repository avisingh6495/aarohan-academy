<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Neon Outline -->
  <circle cx="256" cy="256" r="230" fill="#0b0f19" stroke="url(#neonGrad)" stroke-width="16" />
  <!-- Heartbeat Wave / Barbell Path -->
  <path d="M 130,256 L 190,256 L 220,130 L 250,380 L 280,210 L 310,290 L 330,256 L 382,256" 
        fill="none" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Dumbbell ends -->
  <rect x="90" y="216" width="40" height="80" rx="12" fill="#6366f1" />
  <rect x="382" y="216" width="40" height="80" rx="12" fill="#10b981" />
</svg>
